<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoboBoat 2027 — GCS</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    background: var(--bg); color: var(--fg);
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #conn {
    margin-left: auto; font-size: 12px; padding: 4px 10px;
    border-radius: 4px; background: #30363d;
  }
  #conn.ok { background: #1f4d2b; color: var(--green); }
  #conn.bad { background: #4d1f1f; color: var(--red); }

  main {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; padding: 16px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 16px;
  }
  .panel h2 {
    font-size: 13px; margin: 0 0 12px 0; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font-family: inherit; font-size: 13px; padding: 10px 16px;
    border-radius: 4px; border: 1px solid var(--border);
    background: #21262d; color: var(--fg); cursor: pointer;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.arm { border-color: var(--green); color: var(--green); }
  button.disarm { border-color: var(--yellow); color: var(--yellow); }
  button.clear { border-color: var(--accent); color: var(--accent); }
  button.estop {
    border-color: var(--red); color: var(--red); font-weight: 700;
    padding: 14px 24px;
  }
  button.start { border-color: var(--accent); color: var(--accent); }
  button.stop { border-color: var(--yellow); color: var(--yellow); }

  select {
    font-family: inherit; font-size: 13px;
    background: #0d1117; color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px;
  }
  label.field {
    font-size: 12px; color: var(--muted); display: flex;
    align-items: center; gap: 6px;
  }

  .state {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 8px; margin-top: 16px;
  }
  .state div {
    background: #0d1117; padding: 8px 12px; border-radius: 4px;
    border: 1px solid var(--border); font-size: 12px;
  }
  .state div span { color: var(--muted); }
  .state div b { color: var(--fg); float: right; }

  .badges { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .badges button {
    text-align: left; padding: 12px; display: flex;
    align-items: flex-start; gap: 10px;
  }
  .badges button .glyph {
    display: inline-block; width: 28px; height: 28px;
    text-align: center; border-radius: 50%; background: #21262d;
    color: var(--accent); font-size: 13px; line-height: 28px;
    font-weight: 700; flex-shrink: 0;
  }
  .badges button .meta { display: flex; flex-direction: column; gap: 2px; }
  .badges button .meta .title { font-weight: 600; }
  .badges button .meta .sub { font-size: 11px; color: var(--muted); }

  .tier-bar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .tier-bar .pill {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tier-bar .pill.core { border-color: var(--green); color: var(--green); }
  .tier-bar .pill.advanced { border-color: var(--yellow); color: var(--yellow); }
  .tier-bar .pill.disruptive { border-color: var(--purple); color: var(--purple); }

  #log {
    font-size: 12px; max-height: 320px; overflow-y: auto;
    background: #0d1117; border-radius: 4px; padding: 8px;
  }
  #log .line { padding: 2px 0; }
  #log .ts { color: var(--muted); }
  #log .ev { color: var(--accent); }
  #log .warn { color: var(--yellow); }
  #log .err { color: var(--red); }
  #log .ok { color: var(--green); }
</style>
</head>
<body>

<header>
  <h1>⌘ RoboBoat 2027 GCS</h1>
  <div id="conn">disconnected</div>
</header>

<main>
  <!-- ================= COMMAND PANEL ================= -->
  <section class="panel">
    <h2>Command</h2>
    <div class="controls">
      <button class="arm"    id="btnArm">Arm</button>
      <button class="disarm" id="btnDisarm">Disarm</button>
      <button class="clear"  id="btnClearFaults">Clear Faults</button>
      <button class="estop"  id="btnEstop">EMERGENCY STOP</button>
    </div>
    <div class="state">
      <div><span>Armed</span><b id="sArmed">–</b></div>
      <div><span>E-Stop</span><b id="sEstop">–</b></div>
      <div><span>Badge</span><b id="sBadge">–</b></div>
      <div><span>Tier</span><b id="sTier">–</b></div>
      <div><span>Task</span><b id="sTask">–</b></div>
      <div><span>FPS</span><b id="sFps">–</b></div>
      <div><span>Surge</span><b id="sSurge">–</b></div>
      <div><span>Yaw</span><b id="sYaw">–</b></div>
    </div>
  </section>

  <!-- ================= MISSION BADGES ================= -->
  <section class="panel">
    <h2>Mission Badges (2027)</h2>

    <div class="tier-bar">
      <label class="field">Tier:
        <select id="tierSel">
          <option value="core">Core</option>
          <option value="advanced">Advanced</option>
          <option value="disruptive">Disruptive</option>
        </select>
      </label>
      <span class="pill core">core</span>
      <span class="pill advanced">advanced</span>
      <span class="pill disruptive">disruptive</span>
    </div>

    <div class="badges">
      <button data-badge="assessment_discovery">
        <span class="glyph">A</span>
        <span class="meta">
          <span class="title">Assessment &amp; Discovery</span>
          <span class="sub">Safe Passage → Emergency Sprint</span>
        </span>
      </button>

      <button data-badge="automated_logistics">
        <span class="glyph">L</span>
        <span class="meta">
          <span class="title">Automated Logistics Support</span>
          <span class="sub">Marina → Delivery Run</span>
        </span>
      </button>

      <button data-badge="dynamic_tasking">
        <span class="glyph">D</span>
        <span class="meta">
          <span class="title">Dynamic Tasking</span>
          <span class="sub">Safe Passage → Sprint → Dynamic Response</span>
        </span>
      </button>
    </div>

    <div class="controls" style="margin-top:12px">
      <button class="stop" id="btnStopBadge">Stop Active Badge</button>
    </div>
  </section>

  <!-- ================= EVENT LOG ================= -->
  <section class="panel" style="grid-column: 1 / -1;">
    <h2>Event Log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
(() => {
  const WS_URL = `ws://${location.hostname || 'localhost'}:8765`;
  let ws = null;
  let reconnectTimer = null;

  const $ = id => document.getElementById(id);
  const conn = $("conn");
  const logEl = $("log");

  function log(msg, cls = "ev") {
    const line = document.createElement("div");
    line.className = "line";
    const ts = new Date().toLocaleTimeString();
    line.innerHTML = `<span class="ts">${ts}</span> <span class="${cls}">${msg}</span>`;
    logEl.prepend(line);
    while (logEl.childElementCount > 200) {
      logEl.removeChild(logEl.lastChild);
    }
  }

  function setConn(ok) {
    conn.textContent = ok ? "connected" : "disconnected";
    conn.className = ok ? "ok" : "bad";
  }

  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    ws = new WebSocket(WS_URL);

    ws.onopen = () => { setConn(true); log("bridge connected", "ok"); };
    ws.onclose = () => {
      setConn(false);
      log("bridge disconnected — retrying", "warn");
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = () => {};

    ws.onmessage = ev => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "telemetry") applyTelemetry(m);
      else if (m.type === "event") handleEvent(m);
      else if (m.type === "error") log(`bridge error: ${m.message}`, "err");
      else if (m.type === "ack") log(`ack: ${m.command}`, "ev");
    };
  }

  function applyTelemetry(t) {
    $("sArmed").textContent = t.armed ?? "–";
    $("sEstop").textContent = t.estop ?? "–";
    $("sBadge").textContent = t.badge ?? "–";
    $("sTier").textContent  = t.tier  ?? "–";
    $("sTask").textContent  = t.task  ?? "–";
    $("sFps").textContent   = t.fps   ?? "–";
    $("sSurge").textContent = (t.surge ?? 0).toFixed(3);
    $("sYaw").textContent   = (t.yaw   ?? 0).toFixed(3);

    $("btnArm").disabled = !!t.armed || !!t.estop;
    $("btnDisarm").disabled = !t.armed;

    if (t.tier && $("tierSel").value !== t.tier) {
      $("tierSel").value = t.tier;
    }
  }

  function handleEvent(e) {
    const map = {
      armed: "ok",
      disarmed: "warn",
      emergency_stop: "err",
      command_timeout: "warn",
      esp32_status: "ev",
      esp32_write_failed: "err",
      arm_failed: "err",
      badge_started: "ev",
      badge_stopped: "warn",
      badge_completed: "ok",
      badge_error: "err",
      task_completed: "ok",
      harbor_alert_override: "warn",
      obstacle_avoided: "warn",
      robo_command_rx: "ev",
      unknown_command: "warn",
      command_error: "err",
      mission_error: "err",
      camera_lost: "warn",
    };
    const cls = map[e.event] || "ev";
    // Compact display for esp32_status so the log stays readable
    if (e.event === "esp32_status") {
      const reason = e.reason ? ` (${e.reason})` : "";
      log(`esp32 → ${e.status}${reason}`, cls);
      return;
    }
    log(`${e.event || "event"}: ${JSON.stringify(e)}`, cls);
  }

  function send(command, payload = {}) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log("bridge offline", "err");
      return;
    }
    ws.send(JSON.stringify({ command, payload }));
  }

  // ---------- Command buttons ----------
  $("btnArm").onclick = () => { send("arm"); log("→ arm"); };
  $("btnDisarm").onclick = () => { send("disarm"); log("→ disarm"); };
  $("btnClearFaults").onclick = () => { send("clear_faults"); log("→ clear faults"); };
  $("btnEstop").onclick = () => {
    if (confirm("EMERGENCY STOP — disarm propulsion?")) {
      send("estop"); log("→ EMERGENCY STOP", "err");
    }
  };

  // ---------- Mission Badges ----------
  document.querySelectorAll("[data-badge]").forEach(btn => {
    btn.onclick = () => {
      const badge = btn.dataset.badge;
      const tier = $("tierSel").value;
      send("start_badge", { badge, tier });
      log(`→ start ${badge} (${tier})`);
    };
  });

  $("btnStopBadge").onclick = () => {
    send("stop_badge");
    log("→ stop badge");
  };

  connect();
})();
</script>
</body>
</html>
